<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />

    <title>IR Solutions - Engineering Solutions</title>
    <meta name="description" content="IR Solutions delivers embedded systems, IoT, and full-stack web and mobile engineering solutions for businesses in Sri Lanka and beyond." />
    <link rel="canonical" href="https://www.irsolutions.company/" />

    <!-- Open Graph / social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IR Solutions" />
    <meta property="og:title" content="IR Solutions - Engineering Solutions" />
    <meta property="og:description" content="Embedded systems, IoT, and full-stack web and mobile engineering solutions." />
    <meta property="og:url" content="https://www.irsolutions.company/" />
    <meta property="og:image" content="https://www.irsolutions.company/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "IR Solutions",
          "alternateName": "IR Solutions - Engineering Solutions",
          "url": "https://www.irsolutions.company/"
        },
        {
          "@type": "Organization",
          "name": "IR Solutions",
          "url": "https://www.irsolutions.company/",
          "logo": "https://www.irsolutions.company/favicon-192.png",
          "founder": { "@type": "Person", "name": "Imal Ravindu Bandara" },
          "sameAs": ["https://github.com/bandaraIR"]
        }
      ]
    }
    </script>

    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <noscript>
      IR Solutions: embedded systems, IoT, and full-stack web and mobile engineering solutions.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
